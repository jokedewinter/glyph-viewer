<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Glyph viewer</title>
    <meta name="description" content="Detail view of every glyph in a font." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/glyph-viewer.css">
</head>

<body>
    <header>
        <h1>Glyph viewer</h1>
        <p>Show all glyphs in a font, generated from a json file</p>
    </header>
    
    <section class="module__glyph_viewer">
        <div class="glyph_view">
            <figure id="glyph_box"></figure>
            <div id="glyph_font"></div>
            <div id="glyph_info"></div>
        </div>
        <section id="glyph_list" class="vscrolling">
        </section>
    </section>
    
    <footer>
        <p>&copy; 2026 Joke De Winter. All rights reserved.</p>
    </footer>
    
    <script src="assets/js/glyph-viewer.js"></script>
    <script>
        let response_promise = fetch('assets/json/Apium-demo_glyphs.json');
        fetch_json(response_promise);
    </script>
</body>
</html>
